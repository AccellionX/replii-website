# /etc/nginx/sites-available/replii.accellionx.com
#
#   sudo cp deploy/nginx.replii.accellionx.com.conf /etc/nginx/sites-available/replii.accellionx.com
#   sudo ln -sf /etc/nginx/sites-available/replii.accellionx.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d replii.accellionx.com

server {
    listen 80;
    listen [::]:80;
    server_name replii.accellionx.com;

    location /healthz {
        proxy_pass http://127.0.0.1:8020/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
